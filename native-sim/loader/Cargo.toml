[package]
name = "reversesim-loader"
version = "0.1.0"
edition = "2021"
description = "Rust loader for ReverseSim prototypes"

[[bin]]
name = "reversesim-loader"
path = "src/main.rs"

[dependencies]
libbpf-sys = "1.7.0"
object = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
