[package]
name = "bpfrejit-daemon"
version = "0.1.0"
edition = "2021"
description = "BpfReJIT userspace daemon — scans and optimizes live kernel BPF programs"

[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libbpf-sys = "1.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[[bin]]
name = "bpfrejit-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libbpf-sys.workspace = true
libc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[profile.release]
opt-level = 3
lto = true
