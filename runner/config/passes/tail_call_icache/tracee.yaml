log_level: 1
programs:
  default:
    command: |
      profile="${BPFREJIT_IMAGE_WORKSPACE}/runner/config/passes/tail_call_icache/profiles/tracee/hash-${PROG_HASH}.json";
      bpfopt --pass tail_call_icache --input "${INPUT}" --output "${OUTPUT}" --report "${REPORT}" --prog-type "${PROG_TYPE}" -- --profile "${profile}" --program-hash "${PROG_HASH}"
