# Default per-pass step config for extract.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_shrq_imm
  - name: bpf_x86_andl_imm32
  - name: bpf_arm64_ubfm_x_imm
command: |
  timeout 6000 bpfopt --pass extract --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET}
