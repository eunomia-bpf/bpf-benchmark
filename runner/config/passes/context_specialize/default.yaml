log_level: 1
command: |
  profile_root="${BPFREJIT_SPECIALIZATION_PROFILE_ROOT:?BPFREJIT_SPECIALIZATION_PROFILE_ROOT is required for context_specialize}";
  profile="${profile_root}/context_specialize/hash-${PROG_HASH}.json";
  bpfopt --pass context_specialize --input "${INPUT}" --output "${OUTPUT}" --report "${REPORT}" --prog-type "${PROG_TYPE}" -- --profile "${profile}" --program-hash "${PROG_HASH}"
