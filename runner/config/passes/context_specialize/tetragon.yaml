log_level: 1
programs:
  default:
    command: |
      profile="${BPFREJIT_IMAGE_WORKSPACE}/runner/config/passes/context_specialize/profiles/tetragon/hash-${PROG_HASH}.json";
      bpfopt --pass context_specialize --input "${INPUT}" --output "${OUTPUT}" --report "${REPORT}" --prog-type "${PROG_TYPE}" -- --profile "${profile}" --program-hash "${PROG_HASH}"
