# Single-pass kinsn ablation with bulk-memory disabled and prefetch enabled.
log_level: 1
command: |
  case "${RUN_TARGET_ARCH:-}" in
    arm64|aarch64)
      bpfopt --pass kinsn --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --bytecode-kinsn-mode all=force,bulk_memory=disable
      ;;
    *)
      bpfopt --pass kinsn --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --kinsn-mode all=force,wide-load=disable,indexed-load=disable,movbe-load=disable --bytecode-kinsn-mode all=force,bulk_memory=disable
      ;;
  esac
