# Default per-pass step config for ccmp.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_arm64_cmp_x
  - name: bpf_arm64_cmp_w
  - name: bpf_arm64_ccmp_x
  - name: bpf_arm64_ccmp_w
  - name: bpf_arm64_cset_x_cond
command: |
  bpfopt --pass ccmp --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --kinsn-mode all=disable
