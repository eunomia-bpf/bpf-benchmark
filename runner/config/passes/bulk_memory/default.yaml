# Default per-pass step config for bulk_memory.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_movzbl
  - name: bpf_x86_movb
  - name: bpf_arm64_ldrb_mem
  - name: bpf_arm64_strb_mem_reg
  - name: bpf_arm64_strb_wzr_mem
command: |
  timeout 6000 bpfopt --pass bulk_memory --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET}
