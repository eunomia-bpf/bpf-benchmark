# Default per-pass step config for bulk_memory.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_movzbl
  - name: bpf_x86_movb
  - name: bpf_arm64_ldrb
  - name: bpf_arm64_strb
command: |
  bpfopt --pass bulk_memory --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --kinsn-mode wide-load=force --kinsn-mode indexed-load=force --kinsn-mode scaled-index-mem=force
