# Default per-pass step config for dce.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
command: |
  timeout 6000 bpfopt --pass dce --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE}