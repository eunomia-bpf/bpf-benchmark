# Default per-pass step config for endian_fusion.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_movzwl
  - name: bpf_x86_movl
  - name: bpf_x86_movq
  - name: bpf_x86_rolw
  - name: bpf_x86_bswapl
  - name: bpf_x86_bswapq
  - name: bpf_arm64_ldrh
  - name: bpf_arm64_ldr_w
  - name: bpf_arm64_ldr_x
  - name: bpf_arm64_rev16_w
  - name: bpf_arm64_rev_w
  - name: bpf_arm64_rev_x
command: |
  timeout 6000 bpfopt --pass endian_fusion --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET}
