# Default per-pass step config for endian_fusion.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
capture_workdir: on_failure
kinsns:
  - name: bpf_endian_load16
    aliases:
      - bpf_endian_load16
  - name: bpf_endian_load32
    aliases:
      - bpf_endian_load32
  - name: bpf_endian_load64
    aliases:
      - bpf_endian_load64
command: |
  timeout 6000 bpfopt --pass endian_fusion --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- ${PASS_LOCAL_ARGS}
