log_level: 1
programs:
  default:
    command: |
      case "${RUN_TARGET_ARCH:-}" in
        arm64|aarch64)
          bpfopt --pass kinsn
            --input ${INPUT} --output ${OUTPUT} --report ${REPORT}
            --prog-type ${PROG_TYPE} --target ${TARGET}
          ;;
        *)
          bpfopt --pass kinsn
            --input ${INPUT} --output ${OUTPUT} --report ${REPORT}
            --prog-type ${PROG_TYPE} --target ${TARGET}
            --
            --kinsn-mode all=force,wide-load=disable,indexed-load=disable,movbe-load=disable
            --bytecode-kinsn-mode bulk_memory=disable
          ;;
      esac
