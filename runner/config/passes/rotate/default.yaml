# Default per-pass step config for rotate.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_movq
  - name: bpf_x86_rolq
  - name: bpf_x86_rorxl
  - name: bpf_arm64_extr_x
  - name: bpf_arm64_extr_w
command: |
  bpfopt --pass rotate --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --kinsn-mode rotate=force
