# Default per-pass step config for rotate.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_rolq_imm
    aliases:
      - bpf_x86_rolq_imm
  - name: bpf_x86_rorxl_imm
    aliases:
      - bpf_x86_rorxl_imm
  - name: bpf_arm64_extr_x
    aliases:
      - bpf_arm64_extr_x
  - name: bpf_arm64_extr_w
    aliases:
      - bpf_arm64_extr_w
command: |
  timeout 6000 bpfopt --pass rotate --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET}
