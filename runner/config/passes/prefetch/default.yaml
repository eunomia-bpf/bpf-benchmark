# Default per-pass step config for prefetch.
# Read by runner/libs/pass_config.py at execute_plan build time.
# Daemon substitutes ${...} vars; runner sends this command verbatim.
log_level: 1
kinsns:
  - name: bpf_x86_prefetchnta
  - name: bpf_x86_prefetcht0
  - name: bpf_x86_prefetcht1
  - name: bpf_x86_prefetcht2
  - name: bpf_arm64_prfm_pldl1keep
  - name: bpf_arm64_prfm_pldl1strm
  - name: bpf_arm64_prfm_pldl2keep
  - name: bpf_arm64_prfm_pldl2strm
command: |
  timeout 6000 bpfopt --pass prefetch --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} ${BPFREJIT_BENCH_PASS_ARGS}
