# Single-pass kinsn ablation with bulk-memory selectors disabled.
log_level: 1
command: |
  bpfopt --pass kinsn --input ${INPUT} --output ${OUTPUT} --report ${REPORT} --prog-type ${PROG_TYPE} --target ${TARGET} -- --kinsn-mode all=force,wide-load=disable,indexed-load=disable,movbe-load=disable --bytecode-kinsn-mode bulk_memory=disable,prefetch=disable
