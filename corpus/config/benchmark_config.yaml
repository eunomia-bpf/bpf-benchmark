policy:
  groups:
    map-only: [noop, map_inline]
    map-dce:      [noop, map_inline, const_prop, dce]
    kinsn: [kinsn]
    kinsn-5: [cond_select, bulk_memory, rotate, extract, endian_fusion]
    kinsn-6: [cond_select, bulk_memory, rotate, extract, endian_fusion, prefetch]
    br:      [noop, wide_mem, const_prop, dce, bounds_check_merge, skb_load_bytes_spec]
    full: [noop, map_inline, const_prop, dce,
           rotate, cond_select, extract, endian_fusion, ccmp, bulk_memory, prefetch,
           wide_mem, bounds_check_merge, skb_load_bytes_spec,
           noop, const_prop, dce]
    full-x86: [noop, map_inline, const_prop, dce,
               kinsn,
               wide_mem, bounds_check_merge, skb_load_bytes_spec,
               noop, const_prop, dce]
  platforms:
    x86_64: { passes: [full-x86] }
    arm64:  { passes: [full] }
