[package]
name = "kinsnprober"
version = "0.1.0"
edition = "2021"
description = "Probe loaded kinsn BTF modules and emit a bpfopt target.json"

[[bin]]
name = "kinsnprober"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libbpf-sys = "1.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
