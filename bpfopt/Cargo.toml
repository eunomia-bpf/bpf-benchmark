[workspace]
members = [
    "kinsnprober",
    "loader",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libbpf-sys = "1.7.0"

[profile.release]
opt-level = 3
lto = true
