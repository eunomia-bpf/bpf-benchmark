# Micro codegen benchmarks with packet-fed pure-jit inputs and packet-context execution where needed.
suite_name: micro_staged_codegen

paths:
  program_dir: micro/programs/build-x86

build:
  runner_binary: runner/build/micro_exec

defaults:
  samples: 10
  warmups: 2
  inner_repeat: 100000
  runtimes: [native, llvmbpf, kernel]
  output: micro/results/dev/pure_jit.json

benchmark_defaults:
  io_mode: staged
  expected_retval: 2

runtimes:
  - name: native

  - name: llvmbpf

  - name: kernel

  - name: native_kernel

benchmarks:
  - name: simple
    base_name: simple
    kernel_input_size: 64
    input_generator: simple
    expected_result: 12345678
    tags: [baseline, pure-jit]

  - name: simple_packet
    base_name: simple_packet
    io_mode: packet
    kernel_input_size: 64
    input_generator: simple_packet
    expected_result: 12345678
    tags: [baseline, packet-backed, helper-free]

  - name: csel_select64
    base_name: csel_select64
    kernel_input_size: 64
    input_generator: csel_select64
    expected_result: 15327322346016019187
    tags: [select, csel, pure-jit, coverage]

  - name: ccmp_all_nonzero
    base_name: ccmp_all_nonzero
    kernel_input_size: 64
    input_generator: ccmp_all_nonzero
    expected_result: 1
    tags: [compare, ccmp, pure-jit, coverage]

  - name: bitmap_popcount_scan
    base_name: bitmap_popcount_scan
    kernel_input_size: 2056
    input_generator: bitmap_popcount_scan
    expected_result: 12830754992348206170
    tags: [bitops, pure-jit]

  - name: sorted_rule_binary_search
    base_name: sorted_rule_binary_search
    kernel_input_size: 392
    input_generator: sorted_rule_binary_search
    expected_result: 126
